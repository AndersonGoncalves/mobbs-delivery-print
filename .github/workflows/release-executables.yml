name: Publish executables

# specs/0141/0142-instalador-bridge-impressao(-linux) (revisão 2026-10-29) — destino muda de
# GitHub Release pra S3 (mesmo bucket público `mobbs-delivery-images` já usado pelos apps
# Flutter, specs/0191), pelo mesmo motivo: o link de Release expunha o nome/endereço do
# repositório ao passar o mouse no botão de baixar.

on:
  push:
    branches:
      - main
  # docs/process/git-workflow.md (mobbs-delivery-app) — roda build/package em toda PR pra
  # development/main (validação), sem disparar o passo de publicar no S3 (só no push, abaixo).
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

concurrency:
  group: release-executables
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write build info
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%d/%m/%Y %H:%M UTC")
          # specs/0200-build-number-automatico-deploy — mesmo esquema do app/web/bff: X.Y.Z do
          # package.json continua manual, o número depois do "+" é sempre a contagem de commits.
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION=$(node -p "require('./package.json').version")
          cat > src/buildInfo.ts <<EOF
          export const BUILD_COMMIT = '${SHORT_SHA}';
          export const BUILD_DATE = '${BUILD_DATE}';
          export const BUILD_VERSION = '${VERSION}+${BUILD_NUMBER}';
          EOF

      - name: Build
        run: npm run build

      - name: Package Windows executable
        run: npm run package:win

      # specs/0142-instalador-bridge-impressao-linux REQ-1 — mesmo runner ubuntu-latest já builda
      # os dois alvos (node20-win-x64/node20-linux-x64) sem binding nativo, sem job separado.
      - name: Package Linux executable
        run: npm run package:linux

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.APK_S3_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APK_S3_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish to S3
        if: github.event_name == 'push'
        run: |
          aws s3 cp mobbs-delivery-print-win.exe s3://mobbs-delivery-images/apks/mobbs-delivery-print-win.exe
          aws s3 cp mobbs-delivery-print-linux s3://mobbs-delivery-images/apks/mobbs-delivery-print-linux
