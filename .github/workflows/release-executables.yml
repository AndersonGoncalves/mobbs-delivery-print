name: Publish executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-executables
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write build info
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%d/%m/%Y %H:%M UTC")
          cat > src/buildInfo.ts <<EOF
          export const BUILD_COMMIT = '${SHORT_SHA}';
          export const BUILD_DATE = '${BUILD_DATE}';
          EOF

      - name: Build
        run: npm run build

      - name: Package Windows executable
        run: npm run package:win

      # specs/0142-instalador-bridge-impressao-linux REQ-1 — mesmo runner ubuntu-latest já builda
      # os dois alvos (node20-win-x64/node20-linux-x64) sem binding nativo, sem job separado.
      - name: Package Linux executable
        run: npm run package:linux

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build mais recente
          body: |
            Build automático a partir do commit ${{ github.sha }}.
            Baixe `mobbs-delivery-print-win.exe` (Windows) ou `mobbs-delivery-print-linux`
            (Linux) abaixo, ou use os links estáveis:
            - `.../releases/latest/download/mobbs-delivery-print-win.exe`
            - `.../releases/latest/download/mobbs-delivery-print-linux`
          prerelease: false
          files: |
            mobbs-delivery-print-win.exe
            mobbs-delivery-print-linux
